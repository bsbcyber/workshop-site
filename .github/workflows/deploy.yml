name: Build and deploy workshop site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Branch deploy avoids a stuck github-pages artifact deployment lock.
permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Summarize dependency advisories
        continue-on-error: true
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs -e 'const a=require("/tmp/npm-audit.json"); console.log("Dependency audit summary:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log([v.severity, name, "range="+v.range, "fixAvailable="+JSON.stringify(v.fixAvailable)].join(" | "));'
      - name: Build static site
        run: npm run build
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
